name: Set up weekly agent
description: Install the pinned pi runtime with the Node.js LTS toolchain
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: "24"
        check-latest: true
        cache: npm
    - name: Install pi agent
      shell: bash
      run: |
        set -euo pipefail
        npm ci --ignore-scripts
        echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
        echo "PI_CODING_AGENT_DIR=$RUNNER_TEMP/pi-agent" >> "$GITHUB_ENV"
        node --version
        node_modules/.bin/pi --version
