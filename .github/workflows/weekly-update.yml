name: Weekly promotion update

on:
  schedule:
    - cron: "0 0 * * 1" # Every Monday 00:00 UTC (09:00 KST)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Override with the repository variable PI_MODEL (e.g. deepseek/deepseek-flash for lower cost).
      PI_MODEL: ${{ vars.PI_MODEL || 'deepseek/deepseek-v4-pro' }}
      PI_THINKING: ${{ vars.PI_THINKING || 'high' }}
      PI_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # the agent checks git history for previously removed entries

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24" # Latest LTS; Node 26 is still Current.
          check-latest: true
          cache: npm

      - name: Install pi agent
        run: |
          npm ci --ignore-scripts
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          echo "PI_CODING_AGENT_DIR=$RUNNER_TEMP/pi-agent" >> "$GITHUB_ENV"
          node --version
          node_modules/.bin/pi --version

      - name: Check required secrets and Exa MCP connection
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: |
          : "${DEEPSEEK_API_KEY:?Set the DEEPSEEK_API_KEY repository secret}"
          : "${EXA_API_KEY:?Set the EXA_API_KEY repository secret}"
          mkdir -p "$PI_CODING_AGENT_DIR"
          cp .pi/mcp.json "$PI_CODING_AGENT_DIR/mcp.json"
          pi mcp list

      - name: Run update agent
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: |
          REPORT="$RUNNER_TEMP/report.md"
          {
            cat .github/prompts/weekly-update.md
            echo
            echo "Today (UTC): $(date -u +%F)"
            echo "Report file path: $REPORT"
          } > "$RUNNER_TEMP/prompt.md"
          pi --approve --print --no-session --no-skills \
            --model "$PI_MODEL" --thinking "$PI_THINKING" \
            --tools 'read,edit,write,bash,grep,find,ls,mcp__exa__*' \
            "@$RUNNER_TEMP/prompt.md"
          if [ ! -s "$REPORT" ]; then
            echo "Agent did not produce a report" >&2
            exit 1
          fi
          echo "REPORT=$REPORT" >> "$GITHUB_ENV"
          echo "TODAY=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Stamp README dates when content changed
        run: |
          if ! git diff --quiet -- README.md README.ko.md README.ja.md; then
            node .github/scripts/update-readme-dates.mjs
          fi

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: bot/weekly-update
          delete-branch: true
          add-paths: |
            README.md
            README.ko.md
            README.ja.md
          commit-message: "docs: 주간 학생 혜택 정보 자동 갱신"
          title: "docs: 주간 학생 혜택 정보 자동 갱신 (${{ env.TODAY }})"
          body-path: ${{ env.REPORT }}
