name: Weekly promotion update

on:
  schedule:
    - cron: "0 0 * * 1" # Every Monday 00:00 UTC (09:00 KST)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Override with the repository variable PI_MODEL (e.g. deepseek/deepseek-flash for lower cost).
      PI_MODEL: ${{ vars.PI_MODEL || 'deepseek/deepseek-v4-pro' }}
      PI_THINKING: ${{ vars.PI_THINKING || 'high' }}
      PI_VERSION: 0.87.1
      PI_EXA_VERSION: 0.6.1
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      PI_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pi agent and Exa extension
        run: |
          npm install -g --ignore-scripts "@earendil-works/pi-coding-agent@${PI_VERSION}"
          pi install "npm:pi-exa@${PI_EXA_VERSION}"
          pi list

      - name: Run update agent
        run: |
          REPORT="$RUNNER_TEMP/report.md"
          {
            cat .github/prompts/weekly-update.md
            echo
            echo "Today (UTC): $(date -u +%F)"
            echo "Report file path: $REPORT"
          } > "$RUNNER_TEMP/prompt.md"
          pi --print --no-session \
            --model "$PI_MODEL" --thinking "$PI_THINKING" \
            --tools read,edit,write,bash,grep,find,ls,web_search_exa,web_fetch_exa \
            "@$RUNNER_TEMP/prompt.md"
          if [ ! -s "$REPORT" ]; then
            echo "Agent did not produce a report" >&2
            exit 1
          fi
          echo "REPORT=$REPORT" >> "$GITHUB_ENV"
          echo "TODAY=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/weekly-update
          delete-branch: true
          add-paths: |
            README.md
            README.ko.md
            README.ja.md
          commit-message: "docs: 주간 학생 혜택 정보 자동 갱신"
          title: "docs: 주간 학생 혜택 정보 자동 갱신 (${{ env.TODAY }})"
          body-path: ${{ env.REPORT }}
