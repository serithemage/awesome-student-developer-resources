name: Update README dates

on:
  push:
    branches: [main]
    paths:
      - README.md
      - README.ko.md
      - README.ja.md
      - .github/scripts/update-readme-dates*.mjs
      - .github/workflows/readme-dates.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-dates
  cancel-in-progress: false

jobs:
  update-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main # Always update the latest main, including queued runs.

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Test date updater
        run: node --test .github/scripts/update-readme-dates.test.mjs

      - name: Update dates and commit changes
        run: |
          node .github/scripts/update-readme-dates.mjs
          if git diff --quiet -- README.md README.ko.md README.ja.md; then
            echo "README dates are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.ko.md README.ja.md
          git commit -m "docs: update README dates (UTC)"
          git push origin HEAD:main
